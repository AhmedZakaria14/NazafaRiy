<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="safwa-platinum-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="safwa-glass-fav" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container with Glow -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

  <!-- Outer Geometric Diamond Frame -->
  <path
    d="M 50 14 L 82 36 L 82 64 L 50 86 L 18 64 L 18 36 Z"
    stroke="url(#safwa-platinum-fav)"
    stroke-width="3"
    stroke-linejoin="round"
    fill="url(#safwa-glass-fav)"
    fill-opacity="0.2"
  />

  <!-- Central Liquid Crystal Droplet -->
  <path
    d="M 50 26 C 50 26, 65 46, 65 57 C 65 65 58.3 72 50 72 C 41.7 72 35 65 35 57 C 35 46 50 26 50 26 Z"
    fill="url(#safwa-platinum-fav)"
  />

  <!-- Core Reflection -->
  <path
    d="M 50 31 C 50 31, 60 48, 60 56 C 60 62 55.5 67 50 67 C 44.5 67 40 62 40 56 C 40 48 50 31 50 31 Z"
    fill="#0A0A0A"
    fill-opacity="0.75"
  />

  <!-- Sparkling 4-Point Star -->
  <path
    d="M 50 44 Q 50 54 40 54 Q 50 54 50 64 Q 50 54 60 54 Q 50 54 50 44 Z"
    fill="#FFFFFF"
  />

  <!-- Top Jewel Accent -->
  <circle cx="50" cy="18" r="2.5" fill="#FFFFFF" />
</svg>
