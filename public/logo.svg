<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="safwa-logo-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="safwa-logo-glass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container (Left side in LTR, Right side in RTL viewBox) -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="20" fill="#0A0A0A" />
    <rect width="98" height="98" x="1" y="1" rx="19" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

    <!-- Diamond Frame -->
    <path
      d="M 50 12 L 84 36 L 84 64 L 50 88 L 16 64 L 16 36 Z"
      stroke="url(#safwa-logo-plat)"
      stroke-width="3"
      stroke-linejoin="round"
      fill="url(#safwa-logo-glass)"
      fill-opacity="0.2"
    />

    <!-- Droplet -->
    <path
      d="M 50 24 C 50 24, 66 45, 66 56 C 66 65 58.8 72 50 72 C 41.2 72 34 65 34 56 C 34 45 50 24 50 24 Z"
      fill="url(#safwa-logo-plat)"
    />

    <!-- Inner Core -->
    <path
      d="M 50 29 C 50 29, 61 47, 61 55 C 61 61 56 67 50 67 C 44 67 39 61 39 55 C 39 47 50 29 50 29 Z"
      fill="#0A0A0A"
      fill-opacity="0.7"
    />

    <!-- Star -->
    <path
      d="M 50 43 Q 50 53 40 53 Q 50 53 50 63 Q 50 53 60 53 Q 50 53 50 43 Z"
      fill="#FFFFFF"
    />

    <circle cx="50" cy="16" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Arabic Typography -->
  <g transform="translate(130, 48)">
    <text x="0" y="16" font-family="'Alexandria', 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      صفوة الرياض
    </text>
    <text x="0" y="44" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="14" font-weight="300" fill="#94A3B8" letter-spacing="1.5">
      خدمات نظافة في الرياض
    </text>
  </g>
</svg>
